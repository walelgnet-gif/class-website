<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="logo-title">Temesgen logo: a shield containing a T-shaped network</title>

  <!-- Shield = security -->
  <path d="M32 4 L56 12 V30 C56 45 46 55 32 60 C18 55 8 45 8 30 V12 Z"
        fill="#0f1d36" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>

  <!-- T shape = Temesgen, drawn as network cabling -->
  <g stroke="#ffe0c2" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="20" y1="23" x2="44" y2="23"/>
    <line x1="32" y1="23" x2="32" y2="44"/>
  </g>

  <!-- Nodes = devices on the network -->
  <g fill="#38bdf8" stroke="#0f1d36" stroke-width="2.5">
    <circle cx="20" cy="23" r="4.5"/>
    <circle cx="44" cy="23" r="4.5"/>
    <circle cx="32" cy="44" r="4.5"/>
  </g>
</svg>
